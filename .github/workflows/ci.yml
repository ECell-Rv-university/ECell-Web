name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          
      - name: Install dependencies
        run: npm ci

      - name: TS Type check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --run
        
      - name: Build Project
        run: npm run build
