
name: Vercel Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    name: Preview Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub deployment
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'Preview',
              description: `Vercel Preview for PR #${context.issue.number}`,
              auto_merge: false,
              required_contexts: []
            });

            const deploymentId = deployment.data.id;

            if (!deploymentId) {
              core.setFailed('GitHub deployment was created but no deployment ID was returned.');
              return;
            }

            core.info(`GitHub deployment ID: ${deploymentId}`);
            core.setOutput('id', String(deploymentId));

      - name: Mark deployment as in progress
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.id }}';

            if (!deploymentId) {
              core.warning('No GitHub deployment ID found. Skipping status update.');
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(deploymentId),
              state: 'in_progress',
              description: 'Deploying preview to Vercel...'
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Preview Environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --git-branch="${{ github.head_ref }}" \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel Project
        run: |
          vercel build \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy Preview
        id: vercel
        run: |
          URL=$(vercel deploy \
            --prebuilt \
            --token="${{ secrets.VERCEL_TOKEN }}")

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Mark GitHub deployment successful
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.id }}';
            const url = '${{ steps.vercel.outputs.url }}';

            if (!deploymentId) {
              core.warning('No GitHub deployment ID found. Skipping success status update.');
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(deploymentId),
              state: 'success',
              environment_url: url,
              description: 'Preview successfully deployed to Vercel'
            });

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.url }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Vercel Preview deployed!**

🔗 ${url}`
            });

      - name: Mark GitHub deployment failed
        if: ${{ failure() && github.event.pull_request.head.repo.full_name == github.repository && steps.deployment.outputs.id != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.id }}';

            if (!deploymentId) {
              core.warning('No GitHub deployment ID found. Cannot mark deployment as failed.');
              return;
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(deploymentId),
              state: 'failure',
              description: 'Vercel preview deployment failed'
            });


